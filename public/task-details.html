<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Details - MTurk Clone</title>

    <link rel="stylesheet" href="css/tasks.css">

    <style>
        .details-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .task-detail-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .task-detail-card h1 {
            margin-bottom: 15px;
        }

        .task-description {
            line-height: 1.7;
            margin: 20px 0;
        }

        .task-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .apply-btn {
            width: 100%;
            padding: 12px 25px;
            background: #16803c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .apply-btn:hover {
            background: #126b32;
        }

        .reviews-section {
            margin-top: 35px;
        }

        .review-card {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stars {
            color: #f5a623;
            font-size: 20px;
        }

        .review-form {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .review-form h3 {
            margin-bottom: 20px;
        }

        .review-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .review-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .review-btn {
            padding: 12px 20px;
            background: #5b4bdb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .review-btn:hover {
            background: #4739b5;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .task-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            MTurk<span>Clone</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tasks.html">Tasks</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="post-task.html">Post a Task</a>
        </div>

    </nav>


    <!-- Task Details -->
    <main class="details-container">

        <div id="taskDetails">

            <p class="loading">
                Loading task details...
            </p>

        </div>


        <!-- Reviews -->
        <section class="reviews-section">

            <h2>Reviews</h2>

            <!-- Review Form -->
            <div class="review-form">

                <h3>Leave a Review</h3>

                <form id="reviewForm">

                    <label for="rating">
                        Rating
                    </label>

                    <select id="rating" required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ - 5 Stars
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ - 4 Stars
                        </option>

                        <option value="3">
                            ⭐⭐⭐ - 3 Stars
                        </option>

                        <option value="2">
                            ⭐⭐ - 2 Stars
                        </option>

                        <option value="1">
                            ⭐ - 1 Star
                        </option>

                    </select>


                    <label for="review">
                        Your Review
                    </label>

                    <textarea
                        id="review"
                        placeholder="Write your review here..."
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="review-btn"
                    >
                        Submit Review
                    </button>

                </form>

            </div>


            <!-- Reviews List -->
            <div id="reviewsList">

                <p class="loading">
                    Loading reviews...
                </p>

            </div>

        </section>

    </main>


    <script src="js/task-details.js"></script>

</body>

</html>
