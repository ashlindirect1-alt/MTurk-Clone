<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Task - MTurk Clone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #f59e0b;
        }

        .page-header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
        }

        .form-container {
            max-width: 700px;
            margin: 20px auto 60px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #16803c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #126b32;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .form-container {
                margin-left: 20px;
                margin-right: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            MTurk<span>Clone</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tasks.html">Tasks</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="post-task.html">Post a Task</a>
        </div>

    </nav>


    <!-- Header -->
    <header class="page-header">

        <h1>Post a Task</h1>

        <p>
            Create a new task for workers to complete.
        </p>

    </header>


    <!-- Form -->
    <main class="form-container">

        <form id="taskForm">

            <div class="form-group">

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter task title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the task clearly"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Data Entry">
                        Data Entry
                    </option>

                    <option value="Surveys">
                        Surveys
                    </option>

                    <option value="Transcription">
                        Transcription
                    </option>

                    <option value="Research">
                        Research
                    </option>

                    <option value="Testing">
                        Testing
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="payment">
                    Payment ($)
                </label>

                <input
                    type="number"
                    id="payment"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter payment amount"
                    required
                >

            </div>


            <div class="form-group">

                <label for="deadline">
                    Deadline
                </label>

                <input
                    type="date"
                    id="deadline"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Post Task
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>

    </main>


    <script>

        document
            .getElementById("taskForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const title =
                    document.getElementById("title").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                const category =
                    document.getElementById("category").value;

                const payment =
                    Number(document.getElementById("payment").value);

                const deadline =
                    document.getElementById("deadline").value;

                const message =
                    document.getElementById("message");


                try {

                    const response = await fetch(
                        "/api/tasks",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                title: title,

                                description: description,

                                category: category,

                                payment: payment,

                                deadline: deadline,

                                requester_id: 1

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success) {

                        message.textContent =
                            "Task posted successfully!";

                        message.style.color =
                            "#16803c";


                        document
                            .getElementById("taskForm")
                            .reset();

                    } else {

                        message.textContent =
                            data.message || "Unable to post task.";

                        message.style.color =
                            "red";
                    }


                } catch (error) {

                    console.error(
                        "Error posting task:",
                        error
                    );

                    message.textContent =
                        "Something went wrong.";

                    message.style.color =
                        "red";
                }

            });

    </script>

</body>

</html>
